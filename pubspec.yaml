name: bugman_graphs
description: Internal pest control graphing app for Holloman Exterminators.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.13.0
  idb_shim: ^2.6.7
  image: ^4.2.0
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_map: ^8.3.1
  flutter_map_dragmarker: ^8.0.3
  latlong2: ^0.9.1
  package_info_plus: ^10.2.1
  flex_color_picker: ^3.8.0
  web: ^1.1.1
  printing: 5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Avoid OneDrive symlink cleanup failures during web/editor validation.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/holloman_exterminators.png
    - assets/branding/modern/
    - assets/fonts/holloman/Bitter-OFL.txt
    - assets/fonts/holloman/Calistoga-OFL.txt
    - assets/fonts/holloman/JetBrainsMono-OFL.txt
  fonts:
    - family: Raider Straight
      fonts:
        - asset: assets/branding/modern/raider-straight.ttf
    - family: Calistoga
      fonts:
        - asset: assets/fonts/holloman/6NUU8F2OJg6MeR7l4e0vtA.ttf
    - family: Bitter
      fonts:
        - asset: assets/fonts/holloman/raxhHiqOu8IVPmnRc6SY1KXhnF_Y8fbfCL8.ttf
        - asset: assets/fonts/holloman/raxhHiqOu8IVPmnRc6SY1KXhnF_Y8SjYCL8.ttf
          weight: 600
        - asset: assets/fonts/holloman/raxhHiqOu8IVPmnRc6SY1KXhnF_Y8RHYCL8.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/holloman/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxjPQ.ttf
        - asset: assets/fonts/holloman/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8FqtjPQ.ttf
          weight: 600
