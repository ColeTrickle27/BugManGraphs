name: bugman_graphs
description: Internal pest control graphing app for Holloman Exterminators.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.13.0
  idb_shim: ^2.6.7
  image: ^4.2.0
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_map: ^8.3.1
  flutter_map_dragmarker: ^8.0.3
  latlong2: ^0.9.1
  package_info_plus: ^10.2.1
  flex_color_picker: ^3.8.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Avoid OneDrive symlink cleanup failures during web/editor validation.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/holloman_exterminators.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
