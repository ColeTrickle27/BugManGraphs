<!DOCTYPE html>
<html>
<head>
  <script>var dartPdfJsBaseUrl = new URL("vendor/pdfjs/", document.baseURI).href;</script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BugManGraphs: graphing, measurements, and site plans for Holloman Exterminators.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BugManGraphs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BugManGraphs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <main id="bugman-startup" role="status" aria-live="polite"
      style="position:fixed;inset:0;z-index:2147483647;display:grid;place-content:center;gap:16px;padding:24px;background:white;color:#20212b;font:16px sans-serif;text-align:center">
    <h1 id="bugman-startup-title" style="font-size:24px;margin:0">Opening BugMan Graphs…</h1>
    <p id="bugman-startup-message">Please wait.</p>
    <button id="bugman-startup-reload" hidden style="padding:12px 24px;font:inherit"
        onclick="window.location.reload()">Reload BugMan Graphs</button>
  </main>
  <noscript>
    <style>#bugman-startup { display: none !important; }</style>
    <p>JavaScript is required to open BugMan Graphs. Enable JavaScript and reload this page.</p>
  </noscript>
  <script>
    (() => {
      let complete = false;
      const showProblem = (failed) => {
        if (complete) return;
        document.getElementById('bugman-startup-title').textContent = failed
            ? 'BugMan Graphs could not open' : 'Still opening BugMan Graphs';
        document.getElementById('bugman-startup-message').textContent =
            'Check your connection. Keep this tab open to continue waiting, or reload to try again.';
        document.getElementById('bugman-startup-reload').hidden = false;
      };
      const timer = setTimeout(() => showProblem(false), 30000);
      window.bugManStartup = {
        complete() {
          complete = true;
          clearTimeout(timer);
          document.getElementById('bugman-startup')?.remove();
        },
        fail() { clearTimeout(timer); showProblem(true); },
      };
      // Resource failures do not always reject Flutter's callback-based loader.
      window.addEventListener('error', (event) => {
        if (event.target === window || event.target?.tagName === 'SCRIPT') {
          window.bugManStartup.fail();
        }
      }, true);
      window.addEventListener('unhandledrejection', () => window.bugManStartup.fail());
    })();
  </script>
  <script>
    // Run on the selected host. Standalone Graphs uses protected OpsBrain APIs;
    // compatibility mounts continue to use their existing base path.
    (() => {
      document.addEventListener(
          'contextmenu', (event) => event.preventDefault());
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?release=20261116-imagery-acreage" async></script>
</body>
</html>
