<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Holloman Exterminators inspection graphing tool.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BugManGraphs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BugManGraphs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // OpsBrain is the canonical host for Graphs. Redirect legacy standalone
    // links before Flutter downloads so both OpsBrain home cards share one
    // cached app and authenticated tracing requests remain same-origin.
    (() => {
      const portalOrigin = 'https://ops.holloman-ext.com';
      const portalPath = '/bugman-graphs/';
      const isPortalRoute =
          window.location.origin === portalOrigin &&
          (window.location.pathname === '/bugman-graphs' ||
           window.location.pathname.startsWith(portalPath));
      const isLegacyStandaloneHost =
          window.location.hostname === 'graphs.holloman-ext.com' ||
          window.location.hostname === 'bugman-graphs.pages.dev';
      if (!isPortalRoute && isLegacyStandaloneHost) {
        const target = new URL(portalPath, portalOrigin);
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.toString());
        return;
      }
      document.addEventListener(
          'contextmenu', (event) => event.preventDefault());
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?release=20260910-trace-repair-1" async></script>
</body>
</html>
