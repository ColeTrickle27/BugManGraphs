name: Imagery iPhone acceptance preview
on:
  push:
    branches: [preview/imagery-iphone-acceptance]
permissions:
  contents: read
concurrency:
  group: imagery-iphone-acceptance
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 tool/build_satellite_preview.py --output build/satellite-preview
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/satellite-preview --project-name=bugman-graphs --branch=imagery-iphone-acceptance
